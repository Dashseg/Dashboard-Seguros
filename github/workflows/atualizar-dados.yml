name: Atualizar dados

on:
  schedule:
    # terças às 09:17 (horário de Brasília) — a SUSEP recarrega o SES às segundas
    - cron: "17 12 * * 2"
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes a atualizar (susep, ans ou ambas)"
        default: "susep ans"
        required: false
      ans_meses_por_execucao:
        description: "Máximo de meses da ANS baixados nesta execução"
        default: "6"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Instalar dependências
        run: pip install -r etl/requirements.txt

      - name: Baixar e processar SUSEP / ANS
        env:
          ANS_MAX_MESES_POR_EXECUCAO: ${{ github.event.inputs.ans_meses_por_execucao || '6' }}
        run: python etl/atualizar.py ${{ github.event.inputs.fontes || 'susep ans' }}

      - name: Gravar dados atualizados no repositório
        run: |
          git config user.name "robo-dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
